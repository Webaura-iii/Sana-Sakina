<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Collection | Mirella Skin & Hair Care</title>
  <meta name="description" content="Browse the full Mirella Skin & Hair Care collection — skincare, haircare and tools by Sana Sakina.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="logo.png">
</head>
<body class="collection-page">
  <nav class="navbar scrolled" id="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <img src="logo.png" alt="Sana Sakina" class="nav-logo-img">
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-menu" id="navMenu">
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#shop">Shop</a></li>
        <li><a href="collection.html" class="nav-active">Collection</a></li>
        <li><a href="index.html#about">About</a></li>
        <li><a href="index.html#reviews">Reviews</a></li>
        <li><a href="index.html#faq">FAQ</a></li>
        <li>
          <button class="cart-btn" id="cartBtn" aria-label="Open cart">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
              <line x1="3" y1="6" x2="21" y2="6"/>
              <path d="M16 10a4 4 0 01-8 0"/>
            </svg>
            <span class="cart-count" id="cartCount">0</span>
          </button>
        </li>
      </ul>
    </div>
  </nav>

  <main class="collection-main">
    <div class="container">
      <div class="section-header collection-header">
        <span class="section-label">All Products</span>
        <h1 class="section-title">Full Collection</h1>
        <div class="gold-divider"></div>
        <p class="collection-sub">Explore every Mirella formula — skincare, haircare & tools.</p>
      </div>
      <div class="filter-bar">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="skincare">Skincare</button>
        <button class="filter-btn" data-filter="haircare">Haircare</button>
        <button class="filter-btn" data-filter="tools">Tools</button>
      </div>
      <div class="product-grid collection-grid" id="productGrid">
        <!-- All products -->
      </div>
      <div class="shop-view-all" style="margin-top:2.5rem">
        <a href="index.html" class="btn btn-outline">← Back to Home</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom" style="padding-top:2rem">
        <div class="gold-divider"></div>
        <p>&copy; 2025 Mirella Skin & Hair Care by Sana Sakina. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <div class="cart-overlay" id="cartOverlay"></div>
  <aside class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
      <h3>Your Cart</h3>
      <button class="cart-close" id="cartClose" aria-label="Close cart">×</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>Total</span>
        <span id="cartTotal">₹0</span>
      </div>
      <button class="btn btn-primary btn-full" id="checkoutBtn">Checkout · UPI</button>
      <button class="btn btn-outline btn-full" id="clearCartBtn">Clear Cart</button>
    </div>
  </aside>

  <div class="toast" id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
